<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #38bdf8;
    }
    /* Dynamic pulsing and flow animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.5; }
    }
    @keyframes floatCardA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCardB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .animated-orb {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .float-card-1 {
      animation: floatCardA 5s ease-in-out infinite;
    }
    .float-card-2 {
      animation: floatCardB 6s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 2.5s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Background Ambient Glows -->
  <circle cx="180" cy="140" r="260" fill="url(#glowLeft)" class="animated-orb" />
  <circle cx="1020" cy="280" r="260" fill="url(#glowRight)" class="animated-orb" style="animation-delay: -3s;" />

  <!-- Dynamic Circuit / Graph Nodes in Background -->
  <g opacity="0.4">
    <path class="flow-line" d="M 80 80 Q 250 40 450 80 T 800 60" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-line" d="M 1120 340 Q 950 380 750 340 T 350 360" fill="none" stroke="#ec4899" stroke-width="2" />
    <circle cx="450" cy="80" r="4" fill="#818cf8" />
    <circle cx="750" cy="340" r="4" fill="#f472b6" />
  </g>

  <!-- Floating Dynamic Tech Cards (Placed to sides so center title stays 100% crisp & unblocked) -->
  <!-- Left Side Floating Card -->
  <g class="float-card-1" transform="translate(60, 240)" filter="url(#shadow)">
    <rect width="200" height="96" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="32" r="10" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5" />
    <path d="M 24 32 L 27 35 L 33 29" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="36" class="pill-text" fill="#f8fafc">OCR &amp; RAG Engine</text>
    <rect x="20" y="56" width="160" height="6" rx="3" fill="#334155" />
    <rect x="20" y="56" width="124" height="6" rx="3" fill="url(#cyanGrad)" />
    <text x="20" y="80" class="code-text">&gt; pipeline: active (100%)</text>
  </g>

  <!-- Right Side Floating Card -->
  <g class="float-card-2" transform="translate(940, 80)" filter="url(#shadow)">
    <rect width="200" height="96" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="32" r="10" fill="#ec4899" fill-opacity="0.2" stroke="#f472b6" stroke-width="1.5" />
    <circle cx="28" cy="32" r="4" fill="#f472b6" />
    <text x="48" y="36" class="pill-text" fill="#f8fafc">Autonomous Agents</text>
    <rect x="20" y="56" width="160" height="6" rx="3" fill="#334155" />
    <rect x="20" y="56" width="140" height="6" rx="3" fill="url(#amberGrad)" />
    <text x="20" y="80" class="code-text">&gt; multi-agent sync: ok</text>
  </g>

  <!-- FOREGROUND: Main Title, Subtitle, and Feature Badges (Always in Foreground) -->
  <g id="foreground-content" transform="translate(0, 0)">
    <!-- Top Category Badge Pill -->
    <g transform="translate(425, 64)" filter="url(#shadow)">
      <rect width="350" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="url(#primaryGrad)" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="0.8">CURATED AWESOME ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" class="title-text" filter="url(#shadow)">
      Awesome AI Document &amp; Office Assistants
    </text>

    <!-- Decorative Gradient Underline -->
    <rect x="420" y="168" width="360" height="4" rx="2" fill="url(#primaryGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="600" y="206" text-anchor="middle" class="subtitle-text">
      Intelligent Knowledge Workspaces • Local-First RAG • Autonomous Office Agents
    </text>

    <!-- Interactive / Feature Pills Array in Center Foreground -->
    <g transform="translate(200, 240)">
      <!-- Pill 1: Knowledge Bases -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" fill-opacity="0.8" />
        <text x="90" y="24" text-anchor="middle" class="pill-text">📚 AI Knowledge Bases</text>
      </g>

      <!-- Pill 2: Document OCR & RAG -->
      <g transform="translate(195, 0)">
        <rect width="195" height="38" rx="19" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.2" fill-opacity="0.8" />
        <text x="97" y="24" text-anchor="middle" class="pill-text">🔍 OCR &amp; Document RAG</text>
      </g>

      <!-- Pill 3: Self-Hosted Suites -->
      <g transform="translate(405, 0)">
        <rect width="185" height="38" rx="19" fill="#14532d" stroke="#16a34a" stroke-width="1.2" fill-opacity="0.8" />
        <text x="92" y="24" text-anchor="middle" class="pill-text">🛡️ Sovereign Self-Hosted</text>
      </g>

      <!-- Pill 4: Office Orchestration -->
      <g transform="translate(605, 0)">
        <rect width="195" height="38" rx="19" fill="#701a75" stroke="#c026d3" stroke-width="1.2" fill-opacity="0.8" />
        <text x="97" y="24" text-anchor="middle" class="pill-text">🤖 Autonomous Agents</text>
      </g>
    </g>

    <!-- Footer Meta Info on Banner -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      SaaS Industry Leaders &amp; Open-Source Self-Hosted Solutions • Filtered by Verified Stars &amp; Scale
    </text>
  </g>
</svg>
